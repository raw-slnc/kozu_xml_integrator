<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="8" fill="#0D47A1"/>

  <!-- Geometric lines (background layer) -->
  <!-- Rectangle frame -->
  <line x1="6"  y1="6"  x2="58" y2="6"  stroke="#42A5F5" stroke-width="0.8" opacity="0.45"/>
  <line x1="6"  y1="58" x2="58" y2="58" stroke="#42A5F5" stroke-width="0.8" opacity="0.45"/>
  <line x1="6"  y1="6"  x2="6"  y2="58" stroke="#42A5F5" stroke-width="0.8" opacity="0.45"/>
  <line x1="58" y1="6"  x2="58" y2="58" stroke="#42A5F5" stroke-width="0.8" opacity="0.45"/>
  <!-- Diagonals -->
  <line x1="6"  y1="6"  x2="58" y2="58" stroke="#42A5F5" stroke-width="0.8" opacity="0.35"/>
  <line x1="58" y1="6"  x2="6"  y2="58" stroke="#42A5F5" stroke-width="0.8" opacity="0.35"/>
  <!-- Cross lines -->
  <line x1="6"  y1="32" x2="58" y2="32" stroke="#42A5F5" stroke-width="0.8" opacity="0.30"/>
  <line x1="32" y1="6"  x2="32" y2="58" stroke="#42A5F5" stroke-width="0.8" opacity="0.30"/>
  <!-- Extra diagonals -->
  <line x1="6"  y1="6"  x2="32" y2="58" stroke="#64B5F6" stroke-width="0.6" opacity="0.25"/>
  <line x1="58" y1="6"  x2="32" y2="58" stroke="#64B5F6" stroke-width="0.6" opacity="0.25"/>
  <line x1="6"  y1="58" x2="32" y2="6"  stroke="#64B5F6" stroke-width="0.6" opacity="0.25"/>
  <line x1="58" y1="58" x2="32" y2="6"  stroke="#64B5F6" stroke-width="0.6" opacity="0.25"/>

  <!-- Nodes at key intersections -->
  <circle cx="6"  cy="6"  r="2.2" fill="#64B5F6"/>
  <circle cx="58" cy="6"  r="2.2" fill="#64B5F6"/>
  <circle cx="6"  cy="58" r="2.2" fill="#64B5F6"/>
  <circle cx="58" cy="58" r="2.2" fill="#64B5F6"/>
  <circle cx="32" cy="6"  r="1.5" fill="#90CAF9"/>
  <circle cx="32" cy="58" r="1.5" fill="#90CAF9"/>
  <circle cx="6"  cy="32" r="1.5" fill="#90CAF9"/>
  <circle cx="58" cy="32" r="1.5" fill="#90CAF9"/>
  <circle cx="32" cy="32" r="2"   fill="#BBDEFB" opacity="0.6"/>

  <!-- XML text (foreground) -->
  <text x="32" y="41"
        font-size="22" font-weight="bold"
        fill="white"
        text-anchor="middle"
        font-family="monospace"
        letter-spacing="1">XML</text>
</svg>
